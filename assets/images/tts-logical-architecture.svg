<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 930" role="img" aria-label="Qwen3-TTS 논리 구조도">
  <title>Qwen3-TTS 논리 구조</title>
  <style>
    .d  { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
    .t  { font-size: 20px; font-weight: 700; }
    .s  { font-size: 15px; fill: #444b57; }
    .m  { font-size: 15px; fill: #444b57; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .core  { fill: #e9e7fb; stroke: #8b7fd4; stroke-width: 2; }
    .entry { fill: #dee5fb; stroke: #6b86d8; stroke-width: 2; }
    .cache { fill: #fdead9; stroke: #e0913f; stroke-width: 2; }
    .db    { fill: #d9eafc; stroke: #4a90d9; stroke-width: 2; }
    .gpu   { fill: #f3e9fd; stroke: #a855f7; stroke-width: 2; }
    .cpu   { fill: #e2f8ef; stroke: #14b8a6; stroke-width: 2; }
    .flow  { fill: none; stroke: #9aa3af; stroke-width: 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <g class="d">
    <!-- entry -->
    <rect x="300" y="70" width="290" height="66" rx="6" class="entry"/>
    <text x="318" y="100" class="t" fill="#22357a">main.py — FastAPI</text>
    <text x="318" y="124" class="s">lifespan · 엔진 워밍업 · 프론트 서빙</text>

    <!-- routers -->
    <rect x="180" y="168" width="530" height="132" rx="6" class="core"/>
    <text x="198" y="199" class="t" fill="#3b2f8f">라우터 · routers/</text>
    <text x="198" y="226" class="m">synthesize</text>        <text x="352" y="226" class="s">— REST 단건/배치</text>
    <text x="198" y="248" class="m">ws_synthesize</text>     <text x="352" y="248" class="s">— WebSocket 스트리밍</text>
    <text x="198" y="270" class="m">multi_synth</text>       <text x="352" y="270" class="s">— 다건 배치</text>
    <text x="198" y="292" class="m">openai_compat</text>     <text x="352" y="292" class="s">— OpenAI/AIVOX 호환</text>

    <!-- text pipeline -->
    <rect x="180" y="332" width="530" height="90" rx="6" class="core"/>
    <text x="198" y="363" class="t" fill="#3b2f8f">텍스트 파이프라인</text>
    <text x="198" y="389" class="s" style="font-size:14px">정리(Length · Unicode · Symbol) → CustomRule → ITN → Punctuation →</text>
    <text x="198" y="410" class="s" style="font-size:14px">Whitespace → 발음교정(최후단) → sentence_splitter</text>

    <!-- synthesis service -->
    <rect x="180" y="454" width="530" height="90" rx="6" class="core"/>
    <text x="198" y="485" class="t" fill="#3b2f8f">합성 서비스 · services/tts/</text>
    <text x="198" y="511" class="s">batch · stream · websocket</text>
    <text x="198" y="532" class="s">common_cache(캐시키) · L0b duration-anomaly(이상 → 캐시배제)</text>

    <!-- redis -->
    <rect x="778" y="454" width="200" height="90" rx="6" class="cache"/>
    <text x="796" y="487" class="t" fill="#b5651d">Redis 캐시</text>
    <text x="796" y="521" class="s">오디오 · 동시성 카운터</text>

    <!-- registry -->
    <rect x="180" y="576" width="530" height="90" rx="6" class="core"/>
    <text x="198" y="607" class="t" fill="#3b2f8f">registry / engine_registry — 엔진 선택</text>
    <text x="198" y="636" class="s">voice_id 접두사(supertonic_ / qwen_st_) → 엔진 라우팅 · twin dedup</text>

    <!-- db -->
    <rect x="778" y="576" width="230" height="90" rx="6" class="db"/>
    <text x="796" y="607" class="t" fill="#1d5c9e">DB</text>
    <text x="796" y="633" class="s">voice 메타 · 실효 설정</text>
    <text x="796" y="654" class="s">audit · SQLite(Ed2)/PG(Ed4)</text>

    <!-- adapters -->
    <rect x="180" y="698" width="530" height="90" rx="6" class="core"/>
    <text x="198" y="729" class="t" fill="#3b2f8f">엔진 어댑터 · engines/</text>
    <text x="198" y="755" class="s">vllm_stream · vllm_batch · vllm_chunk · vllm_lang · vllm_voice</text>
    <text x="198" y="776" class="s">supertonic_remote · voice_fallback · vocoder · health_mixin</text>

    <!-- backends -->
    <rect x="180" y="828" width="230" height="82" rx="6" class="gpu"/>
    <text x="198" y="861" class="t" fill="#6b21a8">vLLM 백엔드 (GPU)</text>
    <text x="198" y="893" class="s">tts-vllm-a :8400</text>

    <rect x="470" y="828" width="260" height="82" rx="6" class="cpu"/>
    <text x="488" y="861" class="t" fill="#0f766e">Supertonic 백엔드 (CPU)</text>
    <text x="488" y="893" class="s">tts-fast-a :11200</text>

    <!-- flows -->
    <path d="M445,136 V160" class="flow" marker-end="url(#a)"/>
    <path d="M445,300 V324" class="flow" marker-end="url(#a)"/>
    <path d="M445,422 V446" class="flow" marker-end="url(#a)"/>
    <path d="M445,544 V568" class="flow" marker-end="url(#a)"/>
    <path d="M445,666 V690" class="flow" marker-end="url(#a)"/>
    <path d="M714,499 H770" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M714,621 H770" class="flow" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M400,788 L305,820" class="flow" marker-end="url(#a)"/>
    <path d="M490,788 L585,820" class="flow" marker-end="url(#a)"/>
  </g>
</svg>
