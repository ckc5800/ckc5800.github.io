<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="/assets/style.css">
    <script>
    // 저장된 선택을 그리기 전에 적용한다 (없으면 OS 설정을 따름)
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {}
    })();
    </script>
</head>
<body>

                <li>
                    <button type="button" class="theme-toggle" id="theme-toggle"

                            <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>

    <main class="container">
        <!-- 인쇄(PDF 저장) 시에만 나오는 머리글 — 출력물만 봐도 누구 것인지 알 수 있게 -->
        <div class="print-head">
            <strong>이윤선</strong> · 6년차 AI 엔지니어
            <span>yoon7829@gmail.com · github.com/ckc5800 · ckc5800.github.io</span>
        </div>
        {{ content }}
    </main>

    <script>
    // 지표 미니 막대 — "2,292 → 334ms" 같은 전후 값을 길이로 옮긴다
    (function () {
        var num = function (t) { return parseFloat(t.replace(/,/g, '')); };
        document.querySelectorAll('.metric-value').forEach(function (el) {
            var m = el.textContent.match(/([\d.,]+)\s*→\s*([\d.,]+)/);
            if (!m) return;
            var a = num(m[1]), b = num(m[2]);
            if (!isFinite(a) || !isFinite(b) || a <= 0 || b <= 0) return;
            var max = Math.max(a, b);
            var bars = document.createElement('span');
            bars.className = 'spark';
            bars.setAttribute('aria-hidden', 'true');
            bars.innerHTML = '<i style="width:' + (a / max * 100).toFixed(1) + '%"></i>'
                           + '<i style="width:' + (b / max * 100).toFixed(1) + '%"></i>';
            el.parentNode.appendChild(bars);
        });
    })();
    </script>

    <script>
    // 읽기 진행 바 — 문서가 한 화면을 넘을 때만 의미가 있다
    (function () {
        var bar = document.getElementById('progress');
        if (!bar) return;
        var ticking = false;
        function draw() {
            ticking = false;
            var max = document.documentElement.scrollHeight - window.innerHeight;
            if (max < 400) { bar.style.width = '0'; return; }
            bar.style.width = Math.min(100, window.scrollY / max * 100) + '%';
        }
        addEventListener('scroll', function () {
            if (!ticking) { ticking = true; requestAnimationFrame(draw); }
        }, { passive: true });
        addEventListener('resize', draw);
        draw();
    })();
    </script>

    <script>
    // 스크롤 진입 — 화면에 들어올 때 한 번만 올라오며 나타난다
    (function () {
        var targets = document.querySelectorAll('.project, .project-card, .publication-item');
        if (!targets.length || !('IntersectionObserver' in window)) return;
        document.documentElement.classList.add('js');
        targets.forEach(function (el) { el.classList.add('reveal'); });
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
                if (!e.isIntersecting) return;
                e.target.classList.add('in');
                io.unobserve(e.target);
            });
        }, { rootMargin: '0px 0px -8% 0px' });
        targets.forEach(function (el) { io.observe(el); });
        // 인쇄 시에는 전부 보이도록
        addEventListener('beforeprint', function () {
            targets.forEach(function (el) { el.classList.add('in'); });
        });
    })();
    </script>

    <script>
    // 테마 전환 — 지금 보이는 색의 반대로 바꾸고 선택을 기억한다
    (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
            var root = document.documentElement;
            var current = root.dataset.theme
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            var next = current === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
        });
    })();
    </script>

    <script>
    // 인쇄 직전에 접힌 상세를 모두 펼치고, 끝나면 원래대로 되돌린다
    (function () {
        function openAll() {
            document.querySelectorAll('details:not([open])').forEach(function (d) {
                d.dataset.printOpened = '1';
                d.open = true;
            });
        }
        function restore() {
            document.querySelectorAll('details[data-print-opened]').forEach(function (d) {
                d.open = false;
                delete d.dataset.printOpened;
            });
        }
        window.addEventListener('beforeprint', openAll);
        window.addEventListener('afterprint', restore);
        if (window.matchMedia) {
            var mq = window.matchMedia('print');
            if (mq.addEventListener) {
                mq.addEventListener('change', function (e) { e.matches ? openAll() : restore(); });
            }
        }
    })();
    </script>

</body>
