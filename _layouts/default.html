<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title }} - 이윤선 AI Engineer Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="/assets/style.css">
    <script>
    // 저장된 선택을 그리기 전에 적용한다 (없으면 OS 설정을 따름)
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        } catch (e) {}
    })();
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="/">이윤선</a>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">홈</a></li>
                <li><a href="/projects.html" class="nav-link">프로젝트</a></li>
                <li><a href="/publications.html" class="nav-link">논문 · 특허</a></li>
                <li>
                    <button type="button" class="theme-toggle" id="theme-toggle"
                            aria-label="밝게 / 어둡게 전환" title="밝게 / 어둡게 전환">
                        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                        </svg>
                        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4.2"/>
                            <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <!-- 인쇄(PDF 저장) 시에만 나오는 머리글 — 출력물만 봐도 누구 것인지 알 수 있게 -->
        <div class="print-head">
            <strong>이윤선</strong> · 6년차 AI 엔지니어
            <span>yoon7829@gmail.com · github.com/ckc5800 · ckc5800.github.io</span>
        </div>
        {{ content }}
    </main>

    <script>
    // 테마 전환 — 지금 보이는 색의 반대로 바꾸고 선택을 기억한다
    (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
            var root = document.documentElement;
            var current = root.dataset.theme
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            var next = current === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
        });
    })();
    </script>

    <script>
    // 인쇄 직전에 접힌 상세를 모두 펼치고, 끝나면 원래대로 되돌린다
    (function () {
        function openAll() {
            document.querySelectorAll('details:not([open])').forEach(function (d) {
                d.dataset.printOpened = '1';
                d.open = true;
            });
        }
        function restore() {
            document.querySelectorAll('details[data-print-opened]').forEach(function (d) {
                d.open = false;
                delete d.dataset.printOpened;
            });
        }
        window.addEventListener('beforeprint', openAll);
        window.addEventListener('afterprint', restore);
        if (window.matchMedia) {
            var mq = window.matchMedia('print');
            if (mq.addEventListener) {
                mq.addEventListener('change', function (e) { e.matches ? openAll() : restore(); });
            }
        }
    })();
    </script>

    <footer class="footer">
        <div class="container">
            <p>
                <a href="https://github.com/ckc5800" target="_blank">GitHub</a> |
                <a href="mailto:yoon7829@gmail.com">Email</a>
            </p>
        </div>
    </footer>
</body>
</html>
